  *zope.org
  *python-ldap.org
  *googlecode.com
  *code.google.com
  pybrary.net
  launchpad.net
  pypi.it.uwosh.edu
  tmrc.mit.edu
  *twistedmatrix.com
  downloads.sourceforge.net
  pypi.zepheira.com
  github.com
  pygooglechart.slowchop.com
extends =
    http://dist.plone.org/release/4.3-latest/versions.cfg
    tinymce-checkout.cfg
